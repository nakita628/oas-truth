name: Test

# release.yml runs after this workflow has passed on main.
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      # The package must build from a clean checkout: dist is never committed.
      - run: vp run oas-truth#build

      - run: vp run test

      # Format check, type-aware lint and type check of every workspace, then the repository
      # linters (zizmor is skipped here; the Lint workflow installs and runs it).
      - run: vp run check
